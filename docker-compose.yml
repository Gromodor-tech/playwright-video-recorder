x-app-environment: &app-environment
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-videos}
  DB_USER: ${DB_USER:-video_user}
  DB_PASSWORD: ${DB_PASSWORD:-video_pass}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}

services:
  web:
    build: .
    image: video-service
    ports:
      - "8000:80"
    volumes:
      - uploads:/app/uploads
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: .
    image: video-service
    entrypoint: ["python", "worker.py"]
    volumes:
      - uploads:/app/uploads
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  enrich:
    build: .
    image: video-service
    profiles: ["tools"]
    entrypoint: ["python", "enrich_companies.py"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-videos}
      POSTGRES_USER: ${DB_USER:-video_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-video_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads: