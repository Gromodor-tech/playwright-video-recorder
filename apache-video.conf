# Apache configuration for the video web service (mod_wsgi, daemon mode).
# The wsgi module itself is loaded by /etc/apache2/mods-available/wsgi.load,
# generated in the Dockerfile with `mod_wsgi-express module-config`.

ServerName localhost
WSGISocketPrefix /var/run/apache2/wsgi

# The Python application runs in its own daemon processes
WSGIDaemonProcess videoapp processes=2 threads=10 python-path=/app display-name=%{GROUP}

# Load the application when the daemon starts, so it waits for the database and
# creates the table at startup (not on the first request)
WSGIImportScript /app/app.wsgi process-group=videoapp application-group=%{GLOBAL}

<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    WSGIProcessGroup videoapp
    WSGIApplicationGroup %{GLOBAL}

    # Uploaded videos are served directly by Apache (must come before WSGIScriptAlias)
    Alias /media/ /app/uploads/
    <Directory /app/uploads>
        Require all granted
    </Directory>

    # Everything else goes to the Flask application
    WSGIScriptAlias / /app/app.wsgi
    <Directory /app>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
